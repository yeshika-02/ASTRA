name: CI — ASTRA Pipeline Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check astra/ pipeline/ training/ data/ tests/

  test:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-cov
      # Includes the model forward-pass smoke tests (tests/test_model_smoke.py),
      # which replace the old inline snippet that called the wrong model API.
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  dataset-integrity:
    name: Dataset integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify manifest hash, split hashes and split disjointness
        run: |
          python - <<'EOF'
          import hashlib, json, pathlib, sys

          def sha(p):
              return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()

          expected = {
              'astra-platform/data/scientific_dataset_freeze_v2.csv': 'f99b4b06f16952033b5445bb0682d059e9ea4c3f99320a05d31aebb25c2dbf58',
              'docs/engineering-log/phase6_train_ids.json': '5a9bf6c6ad40757a52d0f4a044626e82a4876839b175f5070fb28834c815eed0',
              'docs/engineering-log/phase6_val_ids.json': 'c733ab95c4a22ebc29ca123b2e923c8b8069933ccdff2e9f03a3fdc882f761b3',
              'docs/engineering-log/phase6_test_ids.json': '2b62970d610f66f12711b6d9594305b33961a04d17c48807bd6123562350f4c0',
          }
          failed = False
          for path, want in expected.items():
              got = sha(path)
              ok = got == want
              failed |= not ok
              print(('OK  ' if ok else 'FAIL'), path, got)

          splits = {k: set(json.load(open(f'docs/engineering-log/phase6_{k}_ids.json'))) for k in ['train', 'val', 'test']}
          sizes = {k: len(v) for k, v in splits.items()}
          print('split sizes', sizes)
          if sizes != {'train': 661, 'val': 141, 'test': 142}:
              failed = True
              print('FAIL unexpected split sizes')
          for a, b in [('train', 'val'), ('train', 'test'), ('val', 'test')]:
              overlap = splits[a] & splits[b]
              if overlap:
                  failed = True
                  print(f'FAIL leakage {a}/{b}: {len(overlap)} ids')
          sys.exit(1 if failed else 0)
          EOF

  reproduction:
    name: Fresh-clone reproduction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      # Pinned environment: the test job above covers the latest versions allowed by
      # requirements.txt; this job checks that the locked versions reproduce.
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-lock.txt
          pip check
      # Verifies all 944 stars x 5 files against the hash-locked manifest, rebuilds the
      # frozen splits (split hash ebcdc44c...) and runs the dataset audit.
      - name: Rebuild data/phase6 from the shipped files
        run: python pipeline/prepare_from_repo.py
      - name: One-epoch training smoke run on the frozen splits
        run: |
          mkdir -p outputs
          python training/train_transformer.py --variant shared --seed 42 --epochs 1 \
            --out-dir outputs/smoke > outputs/train.log 2>&1 || { tail -40 outputs/train.log; exit 1; }
          tail -3 outputs/train.log
      - name: Check recorded provenance
        run: |
          python - <<'EOF'
          import json, sys
          meta = json.load(open("outputs/smoke/experiment_metadata_shared.json"))
          checks = {
              "dataset_fingerprint_hash": "f99b4b06f16952033b5445bb0682d059e9ea4c3f99320a05d31aebb25c2dbf58",
              "split_hash_root": "ebcdc44c3dba849579675369b1559c77e50b6fead06abd40d3fc187425a7d4e4",
              "parameter_count": 1373701,
              "seed": 42,
          }
          failed = [k for k, v in checks.items() if meta.get(k) != v]
          print("provenance:", {k: meta.get(k) for k in checks})
          sys.exit(1 if failed else 0)
          EOF

  frontend:
    name: Web platform (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astra-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: astra-platform/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # API, security (injection), no-fabrication and health tests
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
