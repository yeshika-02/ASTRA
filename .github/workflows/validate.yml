name: AgentOS Validate

# Manual-only until ASTRA's docs link check passes and the AgentOS validator reaches 100/100
# (ADR-0059, task T9). Then restore: push to [main, develop] and pull_request to [main].
on:
  workflow_dispatch:

jobs:
  validate:
    name: AgentOS Health Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run AgentOS Validator
        run: python3 tools/scripts/validate_agentos.py

      - name: Run Synthetic Validation Suite
        run: python3 validation/runner/execute_suite.py

      - name: Bootstrap Self-Test
        run: python3 tools/scripts/bootstrap_project.py --self-test
